[project]
name = "supportdesk-rag-workshop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sreenath Tella", email = "tellanad@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=0.5.0",
    "faiss-cpu>=1.9.0",
    "langchain>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-experimental>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "llama-index>=0.12.0",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-llms-openai>=0.7.10",
    "matplotlib>=3.7.0",
    "nltk>=3.8.0",
    "numpy>=1.24.0",
    "openai>=1.50.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.3.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
]

[project.scripts]
supportdesk-rag-workshop = "supportdesk_rag_workshop:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
